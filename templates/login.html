<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema</title>
    <style>
        html, body {
            height:100%;
            margin:0;
            padding:0;
            font-family:"Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e9f0fb 0%, #f6f8fb 100%);
            display:flex;
            flex-direction:column;
            color:#111;
        }

        .browser-bar {
            position:fixed;
            top:0;
            left:0;
            right:0;
            height:56px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 20px;
            background:rgba(255,255,255,0.95);
            border-bottom:1px solid rgba(0,0,0,0.06);
            z-index:1000;
        }

        .browser-dots {
            display:flex;
            gap:8px;
        }

        .dot {
            width:12px;
            height:12px;
            border-radius:50%;
        }

        .dot.red {
            background:#ff5f56;
        }

        .dot.yellow {
            background:#ffbd2e;
        }

        .dot.green {
            background:#27ca3f;
        }

        .browser-controls { display:flex; gap:12px; align-items:center; }
        .mode-toggle { background:#111; color:#fff; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; }
        .logout-btn { display:none; } /* login não precisa do sair */

        .content {
            flex:1; display:flex; justify-content:center; align-items:center;
            padding:80px 20px 40px;
        }

        .form-container {
            width:100%;
            max-width:400px;
            background:white;
            padding:28px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
            text-align:center;
        }

        h1 { margin-bottom:8px; font-size:28px; font-weight:600; }
        .subtitle { margin-bottom:28px; color:#666; font-size:14px; }

        label {
            display:block;
            text-align:left;
            font-size:14px;
            margin-bottom:6px;
            font-weight:500;
        }

        input {
            width:95%;
            padding:12px;
            border-radius:6px;
            border:1px solid rgba(0,0,0,0.12);
            margin-bottom:18px;
            font-size:14px;
        }

        .btn {
            width:100%; padding:12px; background:#111; color:#fff;
            border:none; border-radius:6px; font-weight:600; cursor:pointer;
        }

        .btn:hover {
            background:#333;
        }

        .forgot-link {
            display:block;
            text-align:center;
            font-size:15px;
            margin:-1px 0 19px;
            color:#0073e6;
            text-decoration:none;
        }

        .forgot-link:hover {
            text-decoration:underline;
        }

        /* Dark mode */
        body.dark-mode { background:#000; color:#fff; }
        body.dark-mode .browser-bar { background:rgba(16,16,16,0.95); }
        body.dark-mode .form-container { background:#111; color:#ddd; }
        body.dark-mode input { background:#1a1a1a; color:#ddd; border:1px solid rgba(255,255,255,0.08); }

        body.dark-mode .btn {
            background:#363636;
            color:#fff;
        }

        body.dark-mode .btn:hover {
            background:#575757;
            color:#fff;
        }

        body.dark-mode button {
            background:#363636;
            color:#ddd;
        }

        body.dark-mode button:hover {
            background:#696969;
            color:#ddd;
        }

    </style>
</head>
<body>
    <div class="browser-bar">
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="browser-dots"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
            <strong>Cadastro Facial</strong>
        </div>
        <div class="browser-controls">
            <span id="modeText">MODO : DIA</span>
            <button id="themeToggle" class="mode-toggle">🌙</button>
        </div>
    </div>

    <main class="content">
        <div class="form-container">
            <h1>Login</h1>
            <p class="subtitle">Faça login para continuar</p>
            <form method="POST">
                {{ form.hidden_tag() }}
                <label for="username">Usuário</label>
                {{ form.username(class="form-control", id="username") }}

                <label for="password">Senha</label>
                {{ form.password(class="form-control", id="password") }}

                <a href="{{ url_for('esqueci_senha') }}" class="forgot-link">Esqueceu a senha?</a>

                {% if secret %}
                <label for="codigo_2fa">Código 2FA</label>
                <input type="text" id="codigo_2fa" name="codigo_2fa" required>
                {% endif %}

                <button type="submit" class="btn">Entrar</button>
            </form>
        </div>
    </main>

    <script>
        (function(){
            const modeText=document.getElementById("modeText");
            const themeToggle=document.getElementById("themeToggle");
            function applyTheme(theme){
                if(theme==="dark"){
                    document.body.classList.add("dark-mode");
                    modeText.textContent="MODO : NOITE";
                    themeToggle.textContent="☀️";
                } else {
                    document.body.classList.remove("dark-mode");
                    modeText.textContent="MODO : DIA";
                    themeToggle.textContent="🌙";
                }
            }
            const saved=localStorage.getItem("site-theme")||"light";
            applyTheme(saved);
            themeToggle.addEventListener("click",()=>{
                const next=document.body.classList.contains("dark-mode")?"light":"dark";
                applyTheme(next);
                localStorage.setItem("site-theme",next);
            });
        })();
    </script>
</body>
</html>
