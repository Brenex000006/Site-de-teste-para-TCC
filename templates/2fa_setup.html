<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar 2FA - Sistema de Moradores</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
        }

        .browser-frame {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .browser-bar {
            background: #f0f0f0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .browser-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27ca3f; }

        .browser-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 12px;
            color: #666;
        }

        .mode-toggle {
            background: #333;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .qr-container {
            margin-bottom: 30px;
        }

        .qr-container img {
            width: 200px;
            height: 200px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #007bff;
            background: white;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .login-btn {
            width: 100%;
            background: #333;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            background: #555;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Dark mode */
        body.dark-mode {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        }

        .dark-mode .browser-frame {
            background: #1a1a1a;
            color: white;
        }

        .dark-mode h1 { color: white; }
        .dark-mode .subtitle { color: #ccc; }
        .dark-mode label { color: #ddd; }
        .dark-mode input[type="text"] {
            background: #2a2a2a;
            border-color: #444;
            color: white;
        }

        .dark-mode input[type="text"]:focus {
            border-color: #007bff;
            background: #333;
        }

        .dark-mode .qr-container img {
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .qr-container img {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="browser-frame">
        <div class="browser-bar">
            <div class="browser-dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="browser-controls">
                <span>MODO - DIA</span>
                <button class="mode-toggle" onclick="toggleTheme()">🌙</button>
            </div>
        </div>

        <div class="content">
            <div class="login-container">
                <h1>Configurar 2FA</h1>
                <p class="subtitle">Escaneie o QR Code e insira o código abaixo</p>

                <div class="qr-container">
                    <img src="{{ url_for('two_factor_qr') }}" alt="QR Code para 2FA">
                </div>

                <form method="POST">
                    <div class="form-group">
                        <label for="codigo_2fa">Código 2FA</label>
                        <input type="text" id="codigo_2fa" name="codigo_2fa" required>
                    </div>
                    <button type="submit" class="login-btn">Ativar 2FA</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const modeText = document.querySelector('.browser-controls span');
            const modeButton = document.querySelector('.mode-toggle');
            if (document.body.classList.contains('dark-mode')) {
                modeText.textContent = 'MODO - NOITE';
                modeButton.textContent = '☀️';
            } else {
                modeText.textContent = 'MODO - DIA';
                modeButton.textContent = '🌙';
            }
        }
    </script>
</body>
</html>
