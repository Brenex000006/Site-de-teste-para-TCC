<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar 2FA</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding:0;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e9f0fb 0%, #f6f8fb 100%);
            display:flex;
            flex-direction:column;
            color:#111;
        }

        /* Barra superior */
        .browser-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: rgba(255,255,255,0.95);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
        }

        .browser-dots { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27ca3f; }

        /* Conteúdo */

        .content {
            flex:1;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:80px 20px 40px;
        }

        .form-container {
            width:100%;
            max-width:420px;
            background:white;
            padding:28px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
            text-align:center;
        }

        h1 {
            margin-bottom:8px;
            font-size:28px;
            font-weight:600;
        }

        .subtitle {
            margin-bottom:20px;
            color:#666;
            font-size:14px;
        }

        .qr-box {
            margin: 20px 0;
        }

        .qr-box img {
            width: 180px;      /* tamanho desejado */
            height: 180px;     /* mantém quadrado */
            object-fit: contain;
            image-rendering: pixelated; /* deixa o QR mais nítido */
        }


        input {
            width:95%;
            padding:12px;
            border-radius:6px;
            margin-top: 2px;
            border:1px solid rgba(0,0,0,0.12);
            margin-bottom:18px;
            font-size:14px;
        }

        .btn {
            width:100%;
            padding:12px;
            background:#111;
            color:#fff;
            border:none;
            border-radius:6px;
            font-weight:600;
            cursor:pointer;
        }

        .btn:hover {
            background:#333;
        }

        .flash {
            background: #ffdddd;
            border: 1px solid #ff5f56;
            color: #a30000;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        /* Dark Mode */

        body.dark-mode {
            background:#000;
            color:#fff;
        }

        body.dark-mode .browser-bar {
            background:rgba(16,16,16,0.95);
        }

        body.dark-mode .form-container {
            background:#111; color:#ddd;
        }

        body.dark-mode input {
            background:#1a1a1a;
            color:#ddd;
            border:1px solid rgba(255,255,255,0.08);
        }

        body.dark-mode .btn {
            background:#363636;
            color:#fff;
        }

        body.dark-mode .btn:hover {
            background:#575757;
            color:#fff;
        }

        .mode-toggle {
            background:#111; color:#fff;
            border:none;
            padding:6px 10px;
            border-radius:6px;
            cursor:pointer;
        }

        body.dark-mode .mode-toggle {
            background:#363636;
        }
    </style>
</head>
<body>

    <div class="browser-bar">
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="browser-dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <strong>Cadastro Facial</strong>
        </div>
        <div class="browser-controls">
            <span id="modeText">MODO : DIA</span>
            <button id="themeToggle" class="mode-toggle">🌙</button>
        </div>
    </div>

    <main class="content">
        <div class="form-container">
            <h1>Ativar 2FA</h1>
            <p class="subtitle">Escaneie o QR Code no Google Authenticator</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="qr-box">
                <img src="{{ url_for('two_factor_qr_admin') }}" alt="QR Code 2FA">
            </div>

            <form method="POST">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="code" style="text-align:left;font-size:14px;font-weight:500; margin-bottom: 4px;">
                    Código do Authenticator
                </label>

                <input type="text" id="code" name="codigo_2fa" placeholder="Digite o código de 6 dígitos">

                <button type="submit" class="btn">Ativar 2FA</button>
            </form>

        </div>
    </main>

    <script>
        /* ===================== TEMA ===================== */
        (function () {
            const modeText = document.getElementById("modeText");
            const toggle = document.getElementById("themeToggle");

            function setTheme(t) {
                document.body.classList.toggle("dark-mode", t === "dark");
                modeText.textContent = t === "dark" ? "MODO : NOITE" : "MODO : DIA";
                toggle.textContent = t === "dark" ? "☀️" : "🌙";
            }

            let saved = localStorage.getItem("site-theme") || "light";
            setTheme(saved);

            toggle.onclick = () => {
                saved = saved === "dark" ? "light" : "dark";
                localStorage.setItem("site-theme", saved);
                setTheme(saved);
            };
        })();
    </script>
</body>
</html>
